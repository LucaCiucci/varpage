[package]
name = "varpage"
version = "0.1.0"
edition = "2024"
authors = ["Luca Ciucci <luca.ciucci99@gmail.com>"]
description = "Compact storage for variable-size records on seekable streams."
license = "MIT"
repository = "https://github.com/LucaCiucci/varpage"
readme = "README.md"
keywords = ["storage", "records", "pages", "varint"]
include = ["/src/", "/examples/", "/benches/", "/docs/format.md", "/README.md", "/LICENSE"]

[dependencies]
smallvec = { version = "1.16.5", features = ["write"] }

[dev-dependencies]
colored = "3.1.1"
criterion = "0.8.2"
fastrand = "2"
zstd = "0.13"

[[bench]]
name = "storage_writes"
harness = false
