name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: extractions/setup-just@v4
    - name: Install stable Rust
      run: rustup toolchain install stable --profile minimal
    - name: Check only
      run: just check-rs
    - name: Check all targets
      run: just check-rs --all-targets
    - name: Run tests
      run: just test-rs
    - name: Doc
      run: just doc-rs
